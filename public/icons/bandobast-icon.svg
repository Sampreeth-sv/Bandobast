<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4F7153"/>
      <stop offset="100%" stop-color="#2D4130"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#E7A83E"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Mandap / Arch & Celebration Halo -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#E7A83E" stroke-width="2.5" opacity="0.3" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#FAF7F0" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Interlocking Connection Nodes (Symbolizing Bandobast: One change, a thousand connections) -->
  <g stroke="#FAF7F0" stroke-width="3" opacity="0.6">
    <line x1="256" y1="120" x2="360" y2="200" />
    <line x1="360" y1="200" x2="330" y2="330" />
    <line x1="330" y1="330" x2="182" y2="330" />
    <line x1="182" y1="330" x2="152" y2="200" />
    <line x1="152" y1="200" x2="256" y2="120" />
    <line x1="256" y1="120" x2="256" y2="256" />
    <line x1="360" y1="200" x2="256" y2="256" />
    <line x1="330" y1="330" x2="256" y2="256" />
    <line x1="182" y1="330" x2="256" y2="256" />
    <line x1="152" y1="200" x2="256" y2="256" />
  </g>
  
  <!-- Central Emblem: Stylized Royal Lotus / Diya of Indian Celebrations -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Core Jewel -->
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="16" fill="#FAF7F0" />
    
    <!-- Outer Petal Rings -->
    <path d="M 0 -70 C 25 -45, 30 -15, 0 0 C -30 -15, -25 -45, 0 -70 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M 66 -22 C 55 10, 30 20, 0 0 C 20 -30, 50 -35, 66 -22 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M 41 57 C 15 55, 5 35, 0 0 C 35 5, 55 25, 41 57 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M -41 57 C -55 25, -35 5, 0 0 C -5 35, -15 55, -41 57 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M -66 -22 C -50 -35, -20 -30, 0 0 C -30 20, -55 10, -66 -22 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Secondary Terracotta Accent Dots -->
    <circle cx="0" cy="-85" r="7" fill="#C76F50"/>
    <circle cx="81" cy="-26" r="7" fill="#C76F50"/>
    <circle cx="50" cy="69" r="7" fill="#C76F50"/>
    <circle cx="-50" cy="69" r="7" fill="#C76F50"/>
    <circle cx="-81" cy="-26" r="7" fill="#C76F50"/>
  </g>
  
  <!-- Perimeter Nodes (Connections) -->
  <circle cx="256" cy="120" r="10" fill="#E7A83E" stroke="#FAF7F0" stroke-width="2.5"/>
  <circle cx="360" cy="200" r="10" fill="#E7A83E" stroke="#FAF7F0" stroke-width="2.5"/>
  <circle cx="330" cy="330" r="10" fill="#E7A83E" stroke="#FAF7F0" stroke-width="2.5"/>
  <circle cx="182" cy="330" r="10" fill="#E7A83E" stroke="#FAF7F0" stroke-width="2.5"/>
  <circle cx="152" cy="200" r="10" fill="#E7A83E" stroke="#FAF7F0" stroke-width="2.5"/>
  
  <!-- Wordmark 'B' Accent at Bottom Curve -->
  <text x="256" y="440" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="34" fill="#FAF7F0" letter-spacing="6">BANDOBAST</text>
</svg>
